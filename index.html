<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0b0f">
<meta name="description" content="Rosefire RP — a persistent FiveM roleplay city. Playable at 1. Alive at 50.">
<title>Rosefire RP | Playable at 1. Alive at 50.</title>
<style>
:root{--bg:#0d0b0f;--panel:#18131a;--text:#f7f2f5;--muted:#b9aeb5;--pink:#ff3d9a;--orange:#ff6a2a;--border:#332832}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(255,61,154,.10),transparent 34rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}a{color:inherit}.site-header{max-width:1240px;margin:auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:28px;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.brand-mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--pink);color:var(--pink);font-weight:900}.brand strong,.brand small{display:block}.brand strong{letter-spacing:.12em}.brand small{color:var(--muted);font-size:.62rem;letter-spacing:.15em}.nav{display:flex;gap:20px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--muted);font-size:.82rem;font-weight:700}.nav a:hover{color:var(--pink)}.hero{max-width:1240px;margin:auto;padding:90px 28px 64px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.65fr);gap:64px;align-items:center}.kicker,.eyebrow,.status-label{color:var(--orange);font-size:.72rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hero h1,.content h1{font-size:clamp(3rem,8vw,7rem);line-height:.9;margin:.15em 0 .12em;letter-spacing:-.055em}.motto{font-size:clamp(1.25rem,3vw,2.3rem);font-weight:900;color:var(--pink);margin:.4rem 0 1.2rem}.lede{max-width:760px;color:var(--muted);font-size:1.08rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.button{display:inline-flex;padding:12px 20px;border:1px solid var(--border);text-decoration:none;font-weight:850;text-transform:uppercase;font-size:.82rem}.button.primary{background:var(--pink);border-color:var(--pink);color:#120b10}.state-card{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--orange);padding:28px}.state-card p:last-child{color:var(--muted)}.status-value{font-weight:900}.content{max-width:1080px;margin:auto;padding:42px 28px 90px}.home-content{border-top:1px solid var(--border)}.content h1{font-size:clamp(2.5rem,7vw,5.5rem)}.content h2{font-size:1.8rem;line-height:1.15;margin-top:2.3em;border-top:1px solid var(--border);padding-top:1.1em}.content h3{font-size:1.18rem;color:var(--pink);margin-top:2em}.content p,.content li{color:#d8cfd5}.content strong{color:var(--text)}blockquote{margin:32px 0;padding:20px 24px;border-left:3px solid var(--pink);background:var(--panel);font-weight:700}hr{border:0;border-top:1px solid var(--border);margin:50px 0}.updated{margin-top:64px;padding-top:18px;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted);text-transform:uppercase}footer{max-width:1240px;margin:auto;padding:30px 28px 50px;border-top:1px solid var(--border);color:var(--muted)}.error{color:#ff9d9d}@media(max-width:900px){.site-header{align-items:flex-start;flex-direction:column}.hero{grid-template-columns:1fr;padding-top:58px;gap:34px}}@media(max-width:520px){.site-header,.hero,.content,footer{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="#/"><span class="brand-mark">RF</span><span><strong>ROSEFIRE RP</strong><small>COMMUNITY PORTAL</small></span></a><nav class="nav"><a href="#/">Home</a><a href="#/getting-started">Start Here</a><a href="#/rules">Rules</a><a href="#/city-guide">City Guide</a><a href="#/lore">Lore</a><a href="#/changelog">Changelog</a><a href="#/faq">FAQ</a></nav></header>
<main id="app"><section class="content"><p>Loading Rosefire…</p></section></main>
<footer><strong>ROSEFIRE RP</strong> · Playable at 1. Alive at 50.</footer>
<script>
const pages={"/":"home.md","/getting-started":"getting-started.md","/rules":"rules.md","/city-guide":"city-guide.md","/lore":"lore.md","/changelog":"changelog.md","/faq":"faq.md"};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(src){src=src.replace(/\r\n/g,"\n");let meta={};if(src.startsWith("---\n")){let e=src.indexOf("\n---\n",4);if(e>-1){src.slice(4,e).split("\n").forEach(l=>{let i=l.indexOf(":");if(i>-1)meta[l.slice(0,i).trim()]=l.slice(i+1).trim().replace(/^["']|["']$/g,"")});src=src.slice(e+5)}}return{meta,body:src.trim()}}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>').replace(/`([^`]+)`/g,"<code>$1</code>")}
function md(src){let out=[],para=[],list=[];const fp=()=>{if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[]}},fl=()=>{if(list.length){out.push("<ul>"+list.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");list=[]}};src.split("\n").forEach(raw=>{let l=raw.trimEnd();if(!l.trim()){fp();fl();return}let h=l.match(/^(#{1,4})\s+(.+)$/);if(h){fp();fl();let n=h[1].length;out.push("<h"+n+">"+inline(h[2])+"</h"+n+">");return}let q=l.match(/^>\s?(.*)$/);if(q){fp();fl();out.push("<blockquote>"+inline(q[1])+"</blockquote>");return}let li=l.match(/^[-*]\s+(.+)$/);if(li){fp();list.push(li[1]);return}if(/^---+$/.test(l.trim())){fp();fl();out.push("<hr>");return}fl();para.push(l.trim())});fp();fl();return out.join("\n")}
async function render(){let path=(location.hash.slice(1)||"/").replace(/\/$/,"")||"/",file=pages[path],app=document.getElementById("app");if(!file){app.innerHTML='<section class="content"><p class="eyebrow">404</p><h1>That road is closed.</h1></section>';return}try{let r=await fetch("./content/"+file+"?v="+Date.now());if(!r.ok)throw Error(r.status);let d=parse(await r.text()),body=md(d.body);if(path==="/"){app.innerHTML='<section class="hero"><div><p class="kicker">'+esc(d.meta.kicker||"ROSEFIRE ROLEPLAY")+'</p><h1>'+esc(d.meta.title||"ROSEFIRE RP")+'</h1><p class="motto">'+esc(d.meta.motto||"PLAYABLE AT 1. ALIVE AT 50.")+'</p><p class="lede">'+esc(d.meta.description||"")+'</p><div class="actions"><a class="button primary" href="#/getting-started">Enter Rosefire</a><a class="button" href="#/rules">Read the rules</a></div></div><aside class="state-card"><p class="status-label">CURRENT STATUS</p><p class="status-value">'+esc(d.meta.status||"FOUNDING TESTERS")+'</p><p>'+esc(d.meta.statusText||"")+'</p></aside></section><article class="content home-content">'+body+'</article>'}else{app.innerHTML='<article class="content">'+(d.meta.eyebrow?'<p class="eyebrow">'+esc(d.meta.eyebrow)+'</p>':"")+body+(d.meta.updated?'<p class="updated">Last updated: '+esc(d.meta.updated)+'</p>':"")+'</article>'}}catch(e){app.innerHTML='<section class="content"><h1>Rosefire</h1><p class="error">This page could not load its content.</p></section>'}}
addEventListener("hashchange",render);render();
</script>
</body></html>
